name: backend-quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  rust-tests:
    name: rust-tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo test --manifest-path src-tauri/Cargo.toml
